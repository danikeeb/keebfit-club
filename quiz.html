:root{--paper:#F7EFE4;--paper2:#F1E3D3;--berry:#E2385F;--ink:#1B1416;--soft:#FFD9E2;--white:#FFFDF9;--mut:#6B5A5E;--grey:#B9AEA8;
  --display:'Dela Gothic One','Arial Black',Impact,sans-serif;--body:Manrope,-apple-system,'Segoe UI',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:600 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;min-height:32px}
.back{border:0;background:none;font:800 22px/1 var(--body);color:var(--ink);cursor:pointer;padding:4px 6px;visibility:hidden}
.bar{flex:1;height:8px;border-radius:99px;background:var(--paper2);overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;width:0;background:var(--berry);transition:width .3s}
.logo{font:400 15px/1 var(--display)}.logo b{color:var(--berry);font-weight:400}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:22px}
.k{font:800 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--berry)}
h1{font:400 clamp(25px,7.2vw,33px)/1.06 var(--display);text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--berry)}
.sub{color:var(--mut);font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--ink);border-radius:16px;background:var(--white);padding:13px 16px;font:700 16px/1.3 var(--body);color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.opt::before{content:"";flex:none;width:20px;height:20px;border:2.5px solid var(--ink);border-radius:50%;background:var(--white)}
.opt.m::before{border-radius:6px}
.opt[aria-pressed="true"]{background:var(--soft)}
.opt[aria-pressed="true"]::before{background:var(--berry);box-shadow:inset 0 0 0 3px var(--white)}
.opt:focus-visible,.go:focus-visible,.alt:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.sl{border:3px solid var(--ink);border-radius:18px;background:var(--white);padding:16px;display:grid;gap:8px}
.sl .v{display:flex;justify-content:space-between;align-items:baseline}
.sl .v b{font:400 34px/1 var(--display)}

input[type=range]{width:100%;accent-color:var(--berry);height:28px}
.note{border-radius:14px;background:var(--soft);padding:12px 14px;font-size:15px}
.note b{color:var(--berry)}
.txt{width:100%;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;font:700 18px/1.2 var(--body);background:var(--white);color:var(--ink)}
.shot{border:3px solid var(--ink);border-radius:20px;background:var(--white);overflow:hidden}
.shot img{display:block;width:100%;max-width:100%;max-height:52vh;object-fit:contain;background:#111;border-bottom:3px solid var(--ink)}

.list{display:grid;gap:6px;padding-left:20px}
.collage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.collage figure{margin:0;display:grid;gap:3px}
.collage img{width:100%;aspect-ratio:2/3;object-fit:cover;border:2px solid var(--ink);border-radius:12px;display:block}
.collage figcaption{font-size:11px;font-weight:800;text-align:center}
.hero{display:grid;gap:14px}
.hero img{width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 25%;border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--berry)}
.plan{border:3px solid var(--ink);border-radius:22px;background:var(--white);overflow:hidden;box-shadow:6px 6px 0 var(--ink)}

.plan .row:last-child{border-bottom:0}
.plan .l{font:800 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.plan .big{font:400 22px/1.1 var(--display)}
.plan .big span{color:var(--berry)}
.mac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.mac div{background:var(--paper);border-radius:10px;padding:6px;text-align:center;font-size:12px;color:var(--mut)}
.mac b{display:block;font:400 16px/1.1 var(--display);color:var(--ink)}
.help{display:grid;gap:8px}
.help div{border-left:4px solid var(--berry);padding-left:10px;font-size:15px}
.help b{display:block}
.inside{display:grid;gap:6px;padding-left:20px;font-size:15px}

function calc(){
 // body fat is snapped to the calculator's buttons so the quiz and the nutrition page show the same norm
 var bmi=A.w/Math.pow(A.h/100,2),est=1.2*bmi+0.23*A.age-5.4,bf=[17,21,25,30,35,40,45].reduce(function(x,y){return Math.abs(y-est)<Math.abs(x-est)?y:x});
 var mif=10*A.w+6.25*A.h-5*A.age-161,lbm=A.w*(1-bf/100),katch=370+21.6*lbm;
 var act=A.time==='60'?2:1,tdee=(mif+katch)/2*[1.2,1.375,1.55,1.725][act];
 // Dani's calibration (4.11.2026, 15 scenarios): a deficit stays between a floor (1400 kcal, or 26 kcal per kg up to 1550)
 // and a cap (1650 with 1–3 workouts, 1800 with more); BMI under 18.5 gets maintenance minus 7%;
 // maintenance tops out at 2000 kcal; protein 130 g on a deficit (120 g up to 52 kg), 140 g otherwise; fat 0.8 g/kg within 40–55 g
 var kcal,prot,fat=Math.min(55,Math.max(40,0.8*A.w));
 if(lose()&&bmi<18.5){kcal=tdee*0.93;prot=130}
 else if(lose()){kcal=Math.min(act<=1?1650:1800,Math.max(Math.max(1400,Math.min(1550,26*A.w)),tdee*0.85));prot=A.w<=52?120:130}
 else{kcal=Math.min(tdee,2000);prot=140;fat=Math.max(45,fat)}
 kcal=Math.round(kcal/50)*50;var carb=Math.max(0,(kcal-prot*4-fat*9)/4);
 return {bmi:bmi,bf:bf,kcal:Math.round(kcal),prot:Math.round(prot),fat:Math.round(fat),carb:Math.round(carb),act:act}
}

function when(weeks){var d=new Date(Date.now()+weeks*7*864e5),day=d.getDate();return (day<=10?'началом':day<=20?'серединой':'концом')+' '+MG[d.getMonth()]}

 return ['Целая я','Всё тело за одну тренировку'];
}

  when:r?[when(r.a),when(r.b)]:null,obst:A.obst||[],know:A.know,goal:A.goal,focus:A.focus,feel:A.feel,time:A.time,ts:Date.now()};
 window.__kfPlan=plan;  // kept in memory too, for viewers where storage is blocked
 try{localStorage.setItem('kf-plan',JSON.stringify(plan));
  // pre-fill the nutrition calculator with her data
  localStorage.setItem('mf-norm',JSON.stringify({sex:'f',age:A.age,h:A.h,w:A.w,bf:bfo,act:c.act,goal:lose()?'lose':'keep',pace:1,method:'palm',ready:true}))}catch(e){}
 return plan;
}
function chart(diet){
 // weight line from now to the goal; the grey line is the usual diet rollercoaster
 var w=A.w,t=lose()?A.target:A.w-2,W=320,H=150,P=24,y=function(v){return P+(w+2-v)/((w+2)-(t-2))*(H-2*P)},x=function(f){return P+f*(W-2*P)};
 var kf='M'+x(0)+' '+y(w);for(var k=1;k<=20;k++){var f=k/20,v=w-(w-t)*(1-Math.pow(1-f,1.6));kf+=' L'+x(f).toFixed(1)+' '+y(v).toFixed(1)}
 var dp=[[0,w],[.15,w-(w-t)*.55],[.3,w-(w-t)*.15],[.45,w-(w-t)*.6],[.6,w+.5],[.75,w-(w-t)*.45],[.9,w+1],[1,w-(w-t)*.3]];
 var dl='M'+dp.map(function(p){return x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)}).join(' L');
 return '<div class="chart"><div class="legend">'+(diet?'<span><i></i>Диеты</span>':'')+'<span><i class="b"></i>Keeb Fit</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График веса">'
  +(diet?'<path d="'+dl+'" fill="none" stroke="#B9AEA8" stroke-width="2.5" stroke-dasharray="5 4"/>':'')
  +'<path d="'+kf+'" fill="none" stroke="#E2385F" stroke-width="3.5" stroke-linecap="round"/>'
  +'<circle cx="'+x(0)+'" cy="'+y(w)+'" r="5" fill="#1B1416"/><circle cx="'+x(1)+'" cy="'+y(t)+'" r="6" fill="#E2385F"/>'
  +'<text x="'+x(0)+'" y="'+(y(w)-10)+'" font-size="12" font-weight="800" fill="#1B1416">'+w+' кг</text>'
  +'<text x="'+(x(1)-4)+'" y="'+(y(t)-12)+'" font-size="12" font-weight="800" fill="#E2385F" text-anchor="end">'+t+' кг</text>'
  +'<text x="'+x(0)+'" y="'+(H-4)+'" font-size="11" fill="#6B5A5E">сейчас</text><text x="'+x(1)+'" y="'+(H-4)+'" font-size="11" fill="#6B5A5E" text-anchor="end">'+(lose()?range().b+' нед':'8 нед')+'</text></svg></div>';
}
function prog(){var n=S.length-2;document.getElementById('bar').style.width=Math.min(100,Math.round(i/n*100))+'%';back.style.visibility=i>0&&S[i].t!=='result'&&S[i].t!=='loading'?'visible':'hidden'}
function btn(label,ok,fn){foot.innerHTML='<button class="go" id="nx" type="button"'+(ok?'':' disabled')+'>'+label+'</button>';document.getElementById('nx').onclick=fn}
function next(){hist.push(i);do{i++}while(S[i].skip&&S[i].skip());render()}
back.onclick=function(){if(hist.length){i=hist.pop();render()}};
function shot(id){var s=SHOT[id];return '<div class="shot"><img src="'+s.img+'" alt="'+esc(s.who)+', до и после"><div><big>'+esc(s.big)+'</big><b>'+esc(s.who)+'</b><span class="sub">'+esc(s.txt)+'</span></div></div>'}
function quote(id){var q=Q[id];return '<div class="quote"><p>«'+esc(q[0])+'»</p><span>'+esc(q[1])+'</span></div>'}
function collage(){return '<div class="collage">'+GIRLS.map(function(g){return '<a class="ig" href="https://www.instagram.com/'+g[2]+'" target="_blank" rel="noopener"><figure><img src="girls/'+g[0]+'.jpg" alt="'+g[1]+'" loading="lazy"><figcaption>'+g[1]+'<span>@'+g[2]+'</span></figcaption></figure></a>'}).join('')+'</div><p class="ighint">Нажми на фото, чтобы открыть её Instagram</p>'}

function render(){

   else{A[s.key]=v;save();b.setAttribute('aria-pressed','true');setTimeout(next,180)}}});

 if(s.t==='slider'){

  document.getElementById('sr').oninput=function(){A[s.key]=+this.value;document.getElementById('sv').textContent=this.value};
  btn('Дальше',true,next);return}
 if(s.t==='hw'){
  var bmiTxt=function(){var b=A.w/Math.pow(A.h/100,2);document.getElementById('bmi').textContent='Индекс массы тела: '+b.toFixed(1)};

   +'<div class="sl"><div class="v"><span>Текущий вес</span><span><b id="wv">'+A.w+'</b> кг</span></div><input type="range" id="wr" min="38" max="150" value="'+A.w+'" aria-label="Вес"></div>'
   +'<div class="sl"><div class="v"><span>Рост</span><span><b id="hv">'+A.h+'</b> см</span></div><input type="range" id="hr" min="140" max="200" value="'+A.h+'" aria-label="Рост"></div><p class="sub" id="bmi"></p>';
  document.getElementById('hr').oninput=function(){A.h=+this.value;document.getElementById('hv').textContent=this.value;bmiTxt()};
  document.getElementById('wr').oninput=function(){A.w=+this.value;document.getElementById('wv').textContent=this.value;bmiTxt()};bmiTxt();
  btn('Дальше',true,function(){A.target=Math.max(38,A.w-(A.goal==='lose_l'?15:A.goal==='lose_m'?8:4));next()});return}
 if(s.t==='target'){
  var draw=function(){var r=range();document.getElementById('tv').textContent=A.target;document.getElementById('tk').textContent='−'+r.kg+' кг от текущего';
   document.getElementById('tn').innerHTML='В здоровом темпе 0,5–1 кг в неделю это примерно <b>'+r.a+'–'+r.b+' недель</b>: где-то между '+when(r.a)+' и '+when(r.b)+'.'};
  main.innerHTML='<div class="k">'+esc(s.k)+'</div><h1>'+s.q+'</h1><div class="sl"><div class="v"><b id="tv">'+A.target+'</b><span>кг</span></div><span class="sub" id="tk"></span><input type="range" id="tr" min="'+Math.max(38,A.w-35)+'" max="'+(A.w-1)+'" value="'+A.target+'" aria-label="Желаемый вес"></div><div class="note" id="tn"></div><p class="sub" style="font-size:12px">Результаты индивидуальны и зависят от многих факторов.</p>';
  document.getElementById('tr').oninput=function(){A.target=+this.value;draw()};draw();
  btn('Дальше',true,next);return}
 if(s.t==='diets'){
  main.innerHTML='<div class="k">Почему не диета</div><h1>Мы не про <span>диеты</span></h1><p class="sub">Сравни, как обычно идёт вес на диете и в системе.</p>'+chart(true)
   +'<div class="cmp2"><div class="d"><b>Диеты</b>Отказы, срывы, вес возвращается</div><div class="k2"><b>Keeb Fit</b>Система, которая встраивается в жизнь: тело без перегруза и привычки, которые остаются</div></div>';
  btn('Понятно',true,next);return}
 if(s.t==='shot'){main.innerHTML='<div class="k">Результаты девушек</div>'+shot(s.id);btn('Дальше',true,next);return}
 if(s.t==='quoteDyn'){main.innerHTML='<div class="k">Как это было у других</div>'+quote(s.pick());btn('Дальше',true,next);return}
 if(s.t==='thanks'){
  var f=(A.feel||[]).map(function(k){return FEEL[k]}).filter(Boolean);
  main.innerHTML='<div class="k">Спасибо, что делишься</div><h1>Для нас важно не просто <span>«сбросить вес»</span></h1>'
   +(f.length?'<p class="sub">А чтобы ты чувствовала:</p><div class="chips p">'+f.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>':'')
   +'<div class="note">Сейчас соберём твой план на основе всего, что ты рассказала.</div>'+quote('arina');
  btn('Дальше',true,next);return}
 if(s.t==='forecast'){
  var r=lose()?range():null;
  main.innerHTML='<div class="k">По нашим расчётам</div>'+(r?'<h1>Ты можешь прийти к <span>'+A.target+' кг</span> за '+r.a+'–'+r.b+' недель</h1>':'<h1>Первые изменения в зеркале через <span>3–4 недели</span></h1>')
   +chart(false)+'<p class="sub" style="font-size:13px">Реалистичный и здоровый темп, без откатов. Результаты у всех разные, это ориентир.</p>'+shot('zaituna');
  btn('Дальше',true,next);return}
 if(s.t==='notweight'){
  var f2=(A.feel||[]).map(function(k){return FEEL[k]}).filter(Boolean);
  main.innerHTML='<div class="k">Иногда это не про вес</div><h1>А про моменты, <span>когда ты:</span></h1><ul class="list"><li>Не хочешь смотреть на себя в зеркало</li><li>Откладываешь «начну с понедельника»</li><li>Сравниваешь себя с другими</li><li>Чувствуешь, что можешь больше, но почему-то не делаешь</li></ul>'
   +'<div class="note"><b>Когда всё рушится, начни с тела.</b> Тело живёт здесь и сейчас: его можно изменить сегодня, даже когда остальное не получается. А теперь представь: ты просыпаешься с лёгкостью, смотришь в зеркало и тебе нравится.</div>'
   +(f2.length?'<p class="sub">И внутри:</p><div class="chips p">'+f2.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>':'');
  btn('Дальше',true,next);return}
 if(s.t==='goodnews'){
  main.innerHTML='<div class="k">Хорошая новость</div><h1>Тебе не придётся <span>полностью менять</span> питание</h1><p class="sub">Мы не убираем привычные продукты, а настраиваем баланс. Ты продолжаешь есть то, что любишь, и при этом худеешь за счёт правильных сочетаний и количества.</p>'+shot('dora');
  btn('Дальше',true,next);return}
 if(s.t==='allowed'){
  main.innerHTML='<div class="k">И да</div><h1>Это всё <span>можно</span></h1><p class="sub">Мы не запрещаем любимые продукты, потому что запреты = срывы.</p><div class="note">Вместо этого ты научишься: есть любимое без чувства вины, не переедать и при этом снижать вес.</div><div class="quote"><p>Именно поэтому результат остаётся с тобой, а не откатывается назад.</p></div>';

 if(s.t==='notweak'){
  main.innerHTML='<div class="k">Скорее всего</div><h1>Ты уже <span>пробовала</span></h1><ul class="list"><li>Диеты</li><li>«Начать новую жизнь»</li><li>Тренировки через силу</li></ul><p class="sub">И каждый раз заканчивалось одинаково.</p><div class="note">Потому что у тебя <b>нет понятной пошаговой системы действий.</b></div><p class="sub">Именно эту систему я передаю клиенткам, с которыми мы строим идеальные «модельные» фигуры.</p><p class="sub">Мои клиентки. Кто-то занимался со мной раньше, кто-то тренируется сейчас:</p>'+collage();

 if(s.t==='name'){

 if(s.t==='loading'){

function showResult(){

 if(!p)p=window.__kfPlan||null;
 if(!p){i=0;render();return}
 document.getElementById('bar').style.width='100%';back.style.visibility='hidden';
 var where={home:'Дома',gym:'В зале',both:'Дома и в зале'}[p.place]||'Дома';

   +'<div class="row"><span class="l">Дальше</span><b>Программа «'+esc(p.prog)+'» — одна из 8 программ клуба KEEB FIT. Внутри я веду тебя по ней 4 недели: план на каждый день, техника, питание и я в чате.</b></div>'
  +'</div>';
 var PR=['Песочные часы','Песочные часы 2.0','Талия-струна','Осанка балерины','Целая я','Лёгкость','Сила: низ','Сила: верх'],OB={food:'f',system:'s',motiv:'m',tired:'t',alone:'a',how:'h'};
 var rc=['route',Math.max(0,PR.indexOf(p.prog)),p.kcal,p.prot,{home:'h',gym:'g',both:'b'}[p.place]||'h',p.time||'30',p.kg||0,p.weeks?p.weeks[0]:0,p.weeks?p.weeks[1]:0,(p.obst||[]).map(function(o){return OB[o]||''}).join('')||'x'].join('-');
 foot.innerHTML='<a class="go" href="index.html#'+rc+'">Дальше: как я тебя поведу →</a>'
