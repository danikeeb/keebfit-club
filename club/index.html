<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Keeb Fit · Кабинет</title>
<style>
/* Layout: member cabinet (test). Home = workouts + machine how-to + library; workout = exercise list; exercise = player, working block, technique. Hash routes: #home, #w0, #w0-2. */
:root{--bg:#F5F5F7;--tile:#FFFFFF;--ink:#1D1D1F;--muted:#6E6E73;--hair:#E3E3E8;--accent:#0071E3;--good:#1E8E3E;--goodbg:#E6F4EA;--bad:#C93C3C;
--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--tile:#161617;--ink:#F5F5F7;--muted:#A1A1A6;--hair:#2C2C2E;--accent:#2D8CFF;--good:#4CC26B;--goodbg:#0F2A17;--bad:#FF6B6B;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.47 var(--f);-webkit-font-smoothing:antialiased}
.in{max-width:720px;margin:0 auto;padding-block:14px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);min-height:32px}
.bar a,.bar button{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
h1{font-size:clamp(28px,7vw,40px);letter-spacing:-.03em;line-height:1.08;margin:6px 0 4px;text-wrap:balance}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:30px 0 10px}
.sub{color:var(--muted);margin:0}
.small{font-size:14px;color:var(--muted)}
.tile{background:var(--tile);border:1px solid var(--hair);border-radius:20px;padding:16px}
.wcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;margin-top:10px;color:var(--ink)}
.wcard img{width:96px;height:96px;border-radius:14px;object-fit:cover}
.wcard b{font-size:20px;letter-spacing:-.02em;display:block}
.prog{height:6px;border-radius:3px;background:var(--hair);margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--good)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vt{background:var(--tile);border:1px solid var(--hair);border-radius:16px;overflow:hidden;text-align:left;padding:0;color:var(--ink)}
.vt img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.vt span{display:block;padding:9px 11px;font-size:14px;font-weight:600;line-height:1.3}
.li{display:flex;gap:12px;align-items:center;background:var(--tile);border:1px solid var(--hair);border-radius:16px;padding:10px;margin-top:8px;width:100%;text-align:left;color:var(--ink)}
.li img{width:60px;height:60px;border-radius:12px;object-fit:cover;flex:none}
.li b{display:block;font-size:16px}
.li .ck{margin-left:auto;color:var(--good);font-weight:700}
.player{margin-top:14px;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:16/9;position:relative}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--tile);border:1px solid var(--hair);border-radius:12px;padding:6px 12px;font-size:15px}
.chip.a{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.work{display:grid;gap:14px;margin-top:14px}
.hint{background:var(--goodbg);border-radius:14px;padding:12px 14px;display:grid;gap:8px;margin-bottom:12px}.hint b{color:var(--good)}.hint span{font-size:15px}
.calm{margin:6px 0 0}.chips .chip{cursor:pointer;color:var(--ink)}.chip.a{background:var(--accent);color:#fff;border-color:var(--accent)}
.logx{margin-top:10px;display:grid;gap:8px}.lh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.lh b{display:block}.lh output{font-weight:700;font-size:20px;white-space:nowrap}
.spark{width:100%;height:44px;display:block}.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lg{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:15px}.lg li{display:flex;gap:12px}.lg span{color:var(--muted);min-width:52px}
.bform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.bform label{display:grid;gap:4px;font-size:14px;color:var(--muted)}.bform input{font:600 18px var(--f);padding:10px 12px;border:1px solid var(--hair);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
details.tile summary{cursor:pointer}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--hair);background:var(--bg);font-size:22px}
.step output{min-width:84px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.sets div{border-radius:12px;text-align:center;padding:10px 4px;font-size:14px;background:var(--bg);color:var(--muted);border:1px solid var(--hair)}
.sets .d{background:var(--goodbg);color:var(--good);border-color:transparent;font-weight:600}
.sets .n{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{border:0;border-radius:14px;padding:15px;font:700 17px var(--f);width:100%;display:block;text-align:center}
.btn.g{background:var(--accent);color:#fff}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--hair)}
.two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.two .btn{font-size:14px;padding:12px 6px}
.timer{display:grid;justify-items:center;gap:6px}
.ring{position:relative;width:170px;height:170px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.opt{display:grid;gap:8px}
.opt button{text-align:left;border:1px solid var(--hair);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;font-size:16px}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.ph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph figure{margin:0;background:var(--tile);border-radius:14px;overflow:hidden;border:1px solid var(--hair)}
.ph img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.ph figcaption{font-size:13px;padding:8px 10px;line-height:1.3}.ph b{display:block;font-size:12px;color:var(--accent)}
ol,ul{margin:0;padding-left:22px;display:grid;gap:8px}
.err{display:grid;gap:10px}.err div{background:var(--tile);border:1px solid var(--hair);border-radius:16px;padding:12px 14px}
.err b{color:var(--bad);display:block}.err span{font-size:15px}
.loop{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:14px;align-items:center}
.loop video{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;background:#111}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.modal[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{width:100%;max-width:520px;background:var(--tile);border-radius:20px;overflow:hidden}
.modal .pv{position:relative;background:#000}
.modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
.modal .cap button{background:none;border:0;color:var(--accent);font-weight:700}
.done{text-align:center;display:grid;gap:8px;justify-items:center;padding:30px 0}
.done b{font-size:26px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:var(--tile);border-top:1px solid var(--hair);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a{display:grid;justify-items:center;gap:1px;font-size:11px;color:var(--muted);padding:4px 0}
.tabbar a i{font-style:normal;font-size:20px;line-height:1}
.tabbar a.on{color:var(--accent);font-weight:600}
.in{padding-bottom:110px}
.week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.week a{background:var(--tile);border:1px solid var(--hair);border-radius:16px;padding:12px;color:var(--ink);display:grid;gap:2px}
.week a span{font-size:13px;color:var(--muted)}.week a i{font-style:normal;color:var(--good);font-weight:700;min-height:1.2em}
.week a.d{background:var(--goodbg);border-color:transparent}
.wcard.soon{opacity:.6}
.ph0{width:96px;height:96px;border-radius:14px;background:linear-gradient(135deg,var(--hair),var(--bg))}
@media (max-width:480px){.loop{grid-template-columns:minmax(0,1fr)}.loop video{max-width:220px}}
</style>
</head>
<body>
<div class="in" id="app"></div>
<div class="modal" id="modal" hidden></div>

<script src="ks.js?v=33"></script>
<script src="extra.js?v=1"></script>
<script>
(function(){
var C='../c/',app=document.getElementById('app'),modal=document.getElementById('modal');
var META={
'1278':{eq:'Гантель 10–14 кг',w:12,step:2,alt:[['Гоблет-присед'],['Плие с гирей']]},
'1274':{eq:'Тренажёр для разведения',w:35,step:5,setup:['m11'],alt:[['Отведение в кроссовере'],['Разведение с резинкой сидя']]},
'1273':{eq:'Тренажёр для ягодичного моста',w:40,step:5,alt:[['Мост на скамье','m14'],['Мост на одной ноге','m14']]},
'1275':{eq:'Тренажёр для сведения',w:30,step:5,setup:['m12'],alt:[['Сведение в кроссовере'],['Сведение с мячом лёжа']]},
'1277':{eq:'Две гантели 8–12 кг',w:10,step:2,alt:[['Гиперэкстензия на ягодицы','m10'],['Румынская тяга со штангой']]},
'1272':{eq:'Две гантели 4–8 кг',w:6,step:1,alt:[['Выпады в Смите'],['Сплит-присед']]},
'1385':{eq:'Верхний блок',w:30,step:5,setup:['m02','m03'],alt:[['Вертикальная тяга в хаммере','m15'],['Подтягивания в гравитроне','m06']]},
'1381':{eq:'Нижний блок',w:30,step:5,setup:['m08','m04'],alt:[['Горизонтальная тяга в хаммере','m16'],['Тяга гантели в наклоне']]},
'1372':{eq:'Наклонная скамья, гантели 6–10 кг',w:8,step:1,alt:[['Жим в тренажёре на грудь','m01'],['Отжимания от скамьи']]},
'1374':{eq:'Скамья, гантели 4–8 кг',w:6,step:1,alt:[['Жим в тренажёре на плечи'],['Жим резинки сидя']]},
'1377':{eq:'Гантель 2–4 кг',w:3,step:1,alt:[['Махи в кроссовере'],['Махи с резинкой']]},
'1378':{eq:'Скамья, гантели 2–4 кг',w:3,step:1,alt:[['Обратная «бабочка» в тренажёре'],['Разведение резинки']]},
'1391':{eq:'Блок с прямой рукоятью',w:15,step:2.5,setup:['m04','m05','m03'],alt:[['Брусья в гравитроне','m17'],['Французский жим с гантелью']]},
'1384':{eq:'Скамья для гиперэкстензии',w:0,step:0,setup:['m09'],alt:[['Гиперэкстензия на ягодицы','m10'],['«Птица-собака»']]}};
var W=[{n:'Низ A',d:'Ягодицы и ноги',ids:['1278','1274','1273','1275','1277','1272'],t:'~50 мин'},{n:'Верх A',d:'Спина, плечи, руки',ids:['1385','1381','1372','1374','1377','1378','1391','1384'],t:'~55 мин'}];
var HOW=['m02','m03','m04','m05'],LIB=['m01','m06','m17','m07','m13','m08','m09','m10','m11','m12','m14','m15','m16'];
var BY={};CARDS.forEach(function(c){BY[c.id]=c});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(l){return esc(Array.isArray(l)?l[0]:l)}
function nm(id){var c=BY[id];return c.name.join(' ').replace('- ','')}
function ks(k){return (window.KS||{})[k]}
function emb(k){return 'https://kinescope.io/embed/'+ks(k)}
var ST={};try{ST=JSON.parse(localStorage.getItem('kf-club')||'{}')}catch(e){}
function save(){try{localStorage.setItem('kf-club',JSON.stringify(ST))}catch(e){}}
function ex(id){var m=META[id];if(!ST[id])ST[id]={w:m.w,last:m.w,done:[]};return ST[id]}
function nsets(id){return parseInt(BY[id].chips[0])||4}
function rest(id){return parseInt((BY[id].chips[2]||'').replace(/\D/g,''))||90}
function kg(v){return String(v).replace('.',',')}
function wfmt(id,v){return META[id].step?kg(v)+' кг':'без веса'}
// Weight steps from the girl's own gym (screen #gym). kind: db = dumbbells, mach = machine/block, grav = gravitron (more weight = easier).
function gym(){var g=ST.gym||{};return {lo:g.lo||1,hi:g.hi||2,st:g.st||5}}
function kind(id){var e=META[id].eq||'';return /Гравитрон/i.test(e)?'grav':/гантел/i.test(e)?'db':'mach'}
function r1(v){return +(+v).toFixed(1)}
function stepUp(id,w){var g=gym(),t=kind(id);if(t==='db')return w<10?Math.min(10,r1(w+g.lo)):r1(w+g.hi);return r1(w+g.st)}
function stepDn(id,w){var g=gym(),t=kind(id);if(t==='db')return Math.max(0,w<=10?r1(w-g.lo):Math.max(10,r1(w-g.hi)));return Math.max(0,r1(w-g.st))}
function nextW(id,w){return kind(id)==='grav'?stepDn(id,w):stepUp(id,w)}
var CALM='Вес растёт медленно. Сначала чистая техника, потом килограммы.';
function hint(id,s){var m=META[id];if((s.streak||0)<2)return '';
  if(!m.step)return '<div class="hint"><b>Стало легко?</b><span>Не спеши усложнять. Делай медленнее и задержись на 2 секунды в самой трудной точке.</span></div>';
  var nw=nextW(id,s.lastFull),g=kind(id)==='grav';if(nw===s.lastFull)return '';
  return '<div class="hint"><b>Можно попробовать '+kg(nw)+' кг</b><span>Ты две тренировки подряд сделала все подходы с '+kg(s.lastFull)+' кг. Если ты уверена в технике, делаешь медленно и без рывков, попробуй следующую ступень'+(g?': в гравитроне это меньше противовеса':'')+'. Появился рывок или сбилась техника, возвращайся к '+kg(s.lastFull)+' кг. Это нормально.</span>'
   +'<div class="two" style="grid-template-columns:1fr 1fr"><button class="btn s" id="hy">Попробую '+kg(nw)+' кг</button><button class="btn s" id="hn">Останусь на '+kg(s.lastFull)+' кг</button></div><a class="small" href="#gym">Другие шаги веса в твоём зале? Настрой ›</a></div>'}
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function pl(n,a,b,c){var m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)}
function dfmt(d){var p=d.split('-');return (+p[2])+' '+MON[+p[1]-1]}
function logIds(){var seen={},out=[];W.forEach(function(w){w.ids.forEach(function(id){if(!seen[id]&&ST[id]&&ST[id].hist&&ST[id].hist.length){seen[id]=1;out.push([id,w.n])}})});return out}
function spark(v,inv){if(v.length<2)return '';var mn=Math.min.apply(0,v),mx=Math.max.apply(0,v),r=mx-mn||1,n=v.length;
  var pts=v.map(function(x,i){return (i*(100/(n-1))).toFixed(1)+','+(inv?4+(x-mn)/r*28:32-(x-mn)/r*28).toFixed(1)}).join(' ');
  return '<svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'"/></svg>'}
function logPage(){stop();var L=logIds(),days={};
  L.forEach(function(x){ST[x[0]].hist.forEach(function(h){days[h.d]=1})});
  var h='<div class="bar"><a href="#train">‹ Тренировки</a><span>Дневник</span></div><h1>Дневник весов</h1><p class="sub">Как растут твои веса от тренировки к тренировке. Сравнивай себя только с собой.</p>';
  if(!L.length){app.innerHTML=h+'<div class="tile" style="margin-top:18px"><b>Пока пусто</b><div class="small">Здесь появятся твои веса после первой тренировки в зале. Отмечай подходы кнопкой «Подход сделан», дальше всё запишется само.</div></div>'+tabs('train');return}
  h+='<div class="chips"><span class="chip a">Тренировок: '+Object.keys(days).length+'</span><span class="chip">Упражнений: '+L.length+'</span></div>';
  L.forEach(function(x){var id=x[0],m=META[id],H=ST[id].hist,g=kind(id)==='grav',top=H.map(function(e){return g?Math.min.apply(0,e.w):Math.max.apply(0,e.w)}),f=top[0],l=top[top.length-1],dlt=r1(l-f);
    var ch=!m.step||H.length<2?'':(dlt===0?'Вес держишь стабильно':(g?(dlt<0?'Противовес меньше на '+kg(-dlt)+' кг':'Противовес больше на '+kg(dlt)+' кг'):(dlt>0?'+'+kg(dlt)+' кг':'−'+kg(-dlt)+' кг'))+' с '+dfmt(H[0].d));
    h+='<div class="tile logx"><div class="lh"><div><b>'+esc(nm(id))+'</b><span class="small">'+esc(x[1])+(g?' · в гравитроне меньше противовес = ты сильнее':'')+'</span></div><output>'+(m.step?kg(l)+' кг':pl(H.length,'тренировка','тренировки','тренировок'))+'</output></div>'
      +(m.step?spark(top.slice(-12),g):'')+(ch?'<div class="small" style="color:var(--good);font-weight:600">'+ch+'</div>':'')
      +'<ul class="lg">'+H.slice(-4).reverse().map(function(e){return '<li><span>'+dfmt(e.d)+'</span>'+(m.step?e.w.map(kg).join(' · ')+' кг':pl(e.w.length,'подход','подхода','подходов'))+'</li>'}).join('')+'</ul></div>'});
  h+='<button class="btn s" id="csv" style="margin-top:18px">Скачать дневник таблицей</button><p class="small" style="margin-top:10px">'+CALM+'</p>';
  app.innerHTML=h+tabs('train');window.scrollTo(0,0);
  document.getElementById('csv').onclick=function(){var rows=[['Дата','Тренировка','Упражнение','Подходы, кг']];
    L.forEach(function(x){ST[x[0]].hist.forEach(function(e){rows.push([e.d,x[1],nm(x[0]),META[x[0]].step?e.w.map(kg).join(' / '):'без веса, '+e.w.length+' подх.'])})});
    rows.sort(function(a,b){return a[0]==='Дата'?-1:b[0]==='Дата'?1:a[0]<b[0]?-1:a[0]>b[0]?1:0});
    var csv='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='keebfit_dnevnik_vesov.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}}
var BM=[['kg','Вес','кг'],['waist','Талия','см'],['hips','Бёдра','см'],['thigh','Бедро','см']];
function daysSince(d){var p=d.split('-');return Math.floor((new Date()-new Date(+p[0],p[1]-1,+p[2]))/864e5)}

}
function firstOpen(k){var ids=W[k].ids;for(var j=0;j<ids.length;j++)if(ex(ids[j]).done.length<nsets(ids[j]))return j;return 0}

function epage(k,j){stop();var w=W[k],id=w.ids[j],c=BY[id],m=META[id];
  var h='<div class="bar"><a href="#w'+k+'">‹ '+w.n+'</a><span>'+(j+1)+' из '+w.ids.length+'</span></div><h1>'+esc(nm(id))+'</h1><p class="sub">'+esc(c.chips[1]||'')+'</p>';
  h+='<div class="player">'+(ks(id)?'<iframe src="'+emb(id)+'" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>':'<p class="small" style="color:#aaa;padding:20px">Видео загружается</p>')+'</div>';
  h+='<div class="chips"><span class="chip a">'+esc(c.chips[0])+'</span><span class="chip">Отдых '+Math.floor(rest(id)/60)+':'+('0'+rest(id)%60).slice(-2)+'</span><span class="chip">'+esc(m.eq)+'</span>'+(c.breath?'<span class="chip">'+T(c.breath)+'</span>':'')+'</div>';
  h+='<div class="tile work" id="work"></div>';
  if(!c.lite)h+='<h2>Три положения</h2><div class="ph">'+['start','mid','end'].map(function(p,q){return '<figure><img src="'+im(id,p)+'" alt="" loading="lazy"><figcaption><b>'+['Старт','Середина','Финиш'][q]+'</b>'+esc(c.pos[q][1])+'</figcaption></figure>'}).join('')+'</div>';
  h+='<h2>Как делать</h2><div class="tile"><ol>'+c.steps.map(function(l){return '<li>'+T(l)+'</li>'}).join('')+'</ol></div>';
  var key=(c.key||[]).concat(c.setup||[]);
  if(key.length)h+='<h2>Главное</h2><div class="tile"><ul>'+key.map(function(l){return '<li>'+T(l)+'</li>'}).join('')+'</ul></div>';
  if(c.err&&c.err.length)h+='<h2>Частые ошибки</h2><div class="err">'+c.err.map(function(e){return '<div><b>'+esc(e[0])+'</b><span>'+esc(e[1])+'</span></div>'}).join('')+'</div>';
  var sid=c.src||id;h+='<h2>Что должна чувствовать</h2>'+(c.lite?'<div class="tile">':'<div class="loop"><video src="'+C+'loop/'+sid+'.mp4" poster="'+C+'loop/'+sid+'.jpg" autoplay muted loop playsinline></video><div class="tile">')+'<ul>'+(c.feel||c.works||[]).map(function(l){return '<li>'+T(l)+'</li>'}).join('')+'</ul></div>'+(c.lite?'':'</div>');
  h+='<div class="nav2"><a class="btn s" href="'+(j>0?'#w'+k+'-'+(j-1):'#w'+k)+'">‹ Назад</a><a class="btn s" href="'+(j<w.ids.length-1?'#w'+k+'-'+(j+1):'#w'+k)+'">'+(j<w.ids.length-1?'Дальше ›':'К списку')+'</a></div>';
  app.innerHTML=h;window.scrollTo(0,0);work(k,j);
}
function work(k,j){stop();var w=W[k],id=w.ids[j],m=META[id],s=ex(id),N=nsets(id),box=document.getElementById('work');
  function sets(){return '<div class="sets">'+Array.from({length:N},function(_,q){var d=s.done[q];return '<div class="'+(d!=null?'d':q===s.done.length?'n':'')+'">'+(d!=null?'✓ '+(m.step?kg(d)+' кг':''):'Подход '+(q+1))+'</div>'}).join('')+'</div>'}
  if(s.done.length>=N){var nx=j<w.ids.length-1;
    box.innerHTML='<div style="text-align:center"><b style="font-size:20px">✓ Упражнение сделано</b><div class="small">'+(m.step?s.done.map(kg).join(' · ')+' кг':'Все подходы')+'</div></div>'+sets()+((s.streak||0)>=2?'<p class="small" style="margin:0">В следующий раз появится подсказка про вес.</p>':'')+'<a class="btn g" href="'+(nx?'#w'+k+'-'+(j+1):'#done'+k)+'">'+(nx?'Дальше: '+esc(nm(w.ids[j+1])):'Завершить тренировку')+'</a><button class="btn s" id="again">Сделать заново</button>';
    document.getElementById('again').onclick=function(){s.last=s.w;s.done=[];save();work(k,j)};return}
  box.innerHTML=(s.done.length?'':hint(id,s))+(m.step?'<div class="wrow"><div><b>Вес</b><div class="small">В прошлый раз '+wfmt(id,s.last)+'</div></div><div class="step"><button id="wm" aria-label="Меньше">−</button><output>'+wfmt(id,s.w)+'</output><button id="wp" aria-label="Больше">+</button></div></div><p class="small calm">'+CALM+' <a href="#gym">Шаги в моём зале</a></p>':'')
    +sets()+'<button class="btn g" id="dn">Подход '+(s.done.length+1)+' сделан</button><div class="two"><button class="btn s" id="bz">⇄ Занято</button>'+(m.setup?'<button class="btn s" id="cf">⚙ Настроить</button>':'<button class="btn s" disabled style="opacity:.4">⚙ Настроить</button>')+'<button class="btn s" id="lt">Позже</button></div><div id="bx"></div>';
  if(m.step){document.getElementById('wm').onclick=function(){s.w=stepDn(id,s.w);save();work(k,j)};document.getElementById('wp').onclick=function(){s.w=stepUp(id,s.w);save();work(k,j)}}
  var hy=document.getElementById('hy');if(hy){hy.onclick=function(){s.w=nextW(id,s.lastFull);s.hintSeen=1;save();work(k,j)};document.getElementById('hn').onclick=function(){s.w=s.lastFull;s.streak=0;save();work(k,j)}}
  document.getElementById('dn').onclick=function(){s.done.push(s.w);
    if(s.done.length>=N){var same=s.done.every(function(v){return v===s.done[0]});s.streak=same?(s.lastFull===s.done[0]?(s.streak||0)+1:1):0;s.lastFull=s.done[0];var td=new Date().toISOString().slice(0,10);s.hist=s.hist||[];if(s.hist.length&&s.hist[s.hist.length-1].d===td)s.hist.pop();s.hist.push({d:td,w:s.done.slice()});if(s.hist.length>60)s.hist.shift()}
    save();if(s.done.length<N)timer(k,j);else work(k,j)};
  document.getElementById('lt').onclick=function(){var nx=w.ids.findIndex(function(x,q){return q!==j&&ex(x).done.length<nsets(x)});document.getElementById('bx').innerHTML='<p class="small" style="margin:0">Вернёшься к нему в конце. '+(nx>=0?'<a href="#w'+k+'-'+nx+'">Перейти к «'+esc(nm(w.ids[nx]))+'» ›</a>':'')+'</p>'};
  document.getElementById('bz').onclick=function(){var bx=document.getElementById('bx');
    bx.innerHTML='<div class="opt"><span class="small">Замени на:</span>'+m.alt.map(function(a,q){return '<button data-q="'+q+'">'+esc(a[0])+'<small>'+(a[1]&&ks(a[1])?'▶ Смотреть технику':(window.ALT_TXT||{})[a[0]]?'Как делать ›':'Видео скоро')+'</small></button>'}).join('')+'</div>';
    bx.querySelectorAll('button').forEach(function(b){b.onclick=function(){var a=m.alt[+b.dataset.q];play(a[1]||'',a[0])}})};
  var cf=document.getElementById('cf');if(cf)cf.onclick=function(){var bx=document.getElementById('bx');
    bx.innerHTML='<div class="opt"><span class="small">Как настроить:</span>'+m.setup.map(function(x){return '<button data-k="'+x+'">'+esc((window.KSN||{})[x]||x)+'<small>▶ Смотреть</small></button>'}).join('')+'</div>';
    bx.querySelectorAll('button').forEach(function(b){b.onclick=function(){play(b.dataset.k,b.firstChild.textContent)}})};
}
function timer(k,j){stop();var id=W[k].ids[j],s=ex(id),N=nsets(id),tot=rest(id),end=Date.now()+tot*1000,box=document.getElementById('work');
  function draw(){var left=Math.max(0,Math.ceil((end-Date.now())/1000)),Cc=2*Math.PI*45;
    box.innerHTML='<div class="timer"><div class="small"><b>ОТДЫХ</b> · подход '+s.done.length+' из '+N+' сделан</div><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--hair)" stroke-width="7"/><circle cx="50" cy="50" r="45" fill="none" stroke="var(--good)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(Cc*left/tot)+' '+Cc+'"/></svg><div>'+Math.floor(left/60)+':'+('0'+left%60).slice(-2)+'</div></div><div class="small">В конце звук и вибрация</div></div><div class="two" style="grid-template-columns:1fr 1fr"><button class="btn s" id="p15">+15 сек</button><button class="btn g" id="go">Готова раньше</button></div>';
    document.getElementById('p15').onclick=function(){end+=15000;tot+=15;draw()};document.getElementById('go').onclick=function(){work(k,j)};
    if(left<=0){stop();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.3)}catch(e){}work(k,j)}}
  draw();tm=setInterval(draw,500);
}
function fin(k){stop();var w=W[k],tot=0;w.ids.forEach(function(id){ex(id).done.forEach(function(v){tot+=v*(parseInt((BY[id].chips[0].split('×')[1]||'12'))||12)})});
  app.innerHTML='<div class="done"><div style="font-size:54px">🏆</div><b>'+w.n+' сделана</b><span class="small">Веса сохранены. В следующий раз начнёшь с них.</span><a class="btn g" href="#home" style="max-width:320px">На главную</a><a class="btn s" href="#log" style="max-width:320px">Мой дневник весов</a></div>';
}
function route(){var h=location.hash.slice(1)||'home',m;
  if((m=/^w(\d)-(\d+)$/.exec(h))&&W[m[1]]&&W[m[1]].ids[m[2]])epage(+m[1],+m[2]);
  else if((m=/^w(\d)$/.exec(h))&&W[m[1]])wpage(+m[1]);
  else if((m=/^done(\d)$/.exec(h))&&W[m[1]])fin(+m[1]);
  else if((m=/^p(\d+)$/.exec(h))&&PROG[m[1]]&&!PROG[m[1]].ready)pinfo(+m[1]);
  else if((m=/^g(\d+)$/.exec(h)))guide(+m[1]);
  else if(h==='gym')gymPage();
  else if(h==='log')logPage();
  else if(h==='body')bodyPage();
  else if(h==='train')train();else if(h==='light')light();else if(h==='food')food();else if(h==='chat')chat();
  else home();
  modal.hidden=true;modal.innerHTML='';
}
window.addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
